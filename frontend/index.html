<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零件庫存系統</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Setup Wizard Overlay (shown on first run) -->
  <div id="setup-overlay" class="setup-overlay hidden">
    <div class="setup-card">
      <div class="setup-header">
        <h2>初次設定</h2>
        <p>請填寫 Email 通知設定，完成後即可開始使用系統。</p>
      </div>
      <div id="setup-message" class="message hidden"></div>
      <form class="setup-form" id="setup-form">
        <div class="form-group">
          <label for="setup-email-user">Gmail 帳號</label>
          <input type="email" id="setup-email-user" placeholder="your@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="setup-email-pass">Gmail App 密碼</label>
          <input type="password" id="setup-email-pass" placeholder="16 位應用程式密碼" required />
          <small class="form-hint">請至 Google 帳戶 → 安全性 → 兩步驟驗證 → 應用程式密碼 取得</small>
        </div>
        <div class="form-group">
          <label for="setup-email-to">通知收件人</label>
          <input type="email" id="setup-email-to" placeholder="alert@example.com" required />
        </div>
        <div class="form-group">
          <label for="setup-smtp-port">SMTP Port</label>
          <input type="number" id="setup-smtp-port" value="587" required />
        </div>
        <div class="setup-actions">
          <button type="button" class="btn btn-secondary" id="btn-setup-test">寄送測試信</button>
          <button type="submit" class="btn btn-primary">完成設定</button>
        </div>
      </form>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-logo">零件庫存系統</div>
      <ul class="sidebar-nav">
        <li><a href="#" class="nav-link active" data-page="parts">零件列表</a></li>
        <li><a href="#" class="nav-link" data-page="increase">補貨</a></li>
        <li><a href="#" class="nav-link" data-page="decrease">消耗</a></li>
        <li><a href="#" class="nav-link" data-page="notifications">低庫存通知</a></li>
        <li class="sidebar-bottom"><a href="#" class="nav-link" data-page="settings">⚙ 系統設定</a></li>
      </ul>
    </nav>

    <main class="content">

      <!-- 零件列表 -->
      <section id="page-parts" class="page active">
        <div class="page-header">
          <h1>零件列表</h1>
          <button class="btn btn-primary" id="btn-new-part">＋ 新增零件</button>
        </div>
        <div id="parts-message" class="message hidden"></div>
        <table class="data-table" id="parts-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>名稱</th>
              <th>儲位</th>
              <th>庫存</th>
              <th>再訂購水位</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="parts-tbody"></tbody>
        </table>
      </section>

      <!-- 新增 / 編輯零件 -->
      <section id="page-part-form" class="page">
        <div class="page-header">
          <h1 id="part-form-title">新增零件</h1>
          <button class="btn btn-secondary" id="btn-back-parts">← 返回列表</button>
        </div>
        <div id="part-form-message" class="message hidden"></div>
        <form class="form-card" id="part-form">
          <input type="hidden" id="part-id" />
          <div class="form-group">
            <label for="part-sku">SKU</label>
            <input type="text" id="part-sku" placeholder="例：BRK-001" required />
          </div>
          <div class="form-group">
            <label for="part-name">名稱</label>
            <input type="text" id="part-name" placeholder="例：煞車皮" required />
          </div>
          <div class="form-group">
            <label for="part-location">儲位</label>
            <input type="text" id="part-location" placeholder="例：A-01-3" />
          </div>
          <div class="form-group">
            <label for="part-stock">庫存數量</label>
            <input type="number" id="part-stock" min="0" value="0" required />
          </div>
          <div class="form-group">
            <label for="part-reorder">再訂購水位</label>
            <input type="number" id="part-reorder" min="0" value="0" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="part-form-submit">儲存</button>
            <button type="button" class="btn btn-danger hidden" id="btn-delete-part">刪除零件</button>
          </div>
        </form>
      </section>

      <!-- 補貨 -->
      <section id="page-increase" class="page">
        <div class="page-header">
          <h1>補貨</h1>
        </div>
        <div id="increase-message" class="message hidden"></div>
        <div class="stock-panel">
          <div class="stock-list-header">
            <span class="col-part">零件</span>
            <span class="col-amount">數量</span>
            <span class="col-note">備註</span>
            <span class="col-action"></span>
          </div>
          <div id="increase-list"></div>
          <div class="stock-list-footer">
            <button type="button" class="btn btn-secondary" id="btn-add-increase">＋ 新增一筆</button>
          </div>
          <div class="stock-submit-row">
            <button type="button" class="btn btn-primary" id="btn-submit-increase">確認補貨</button>
          </div>
        </div>
      </section>

      <!-- 消耗 -->
      <section id="page-decrease" class="page">
        <div class="page-header">
          <h1>消耗</h1>
        </div>
        <div id="decrease-message" class="message hidden"></div>
        <div class="stock-panel">
          <div class="stock-list-header">
            <span class="col-part">零件</span>
            <span class="col-amount">數量</span>
            <span class="col-note">備註</span>
            <span class="col-action"></span>
          </div>
          <div id="decrease-list"></div>
          <div class="stock-list-footer">
            <button type="button" class="btn btn-secondary" id="btn-add-decrease">＋ 新增一筆</button>
          </div>
          <div class="stock-submit-row">
            <button type="button" class="btn btn-primary" id="btn-submit-decrease">確認消耗</button>
          </div>
        </div>
      </section>

      <!-- 低庫存通知 -->
      <section id="page-notifications" class="page">
        <div class="page-header">
          <h1>低庫存通知</h1>
          <button class="btn btn-secondary" id="btn-refresh-notifications">重新整理</button>
        </div>
        <div id="notifications-empty" class="empty-state hidden">目前無低庫存通知</div>
        <table class="data-table" id="notifications-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>名稱</th>
              <th>再訂購水位</th>
              <th>通知時間</th>
            </tr>
          </thead>
          <tbody id="notifications-tbody"></tbody>
        </table>
      </section>

      <!-- 系統設定 -->
      <section id="page-settings" class="page">
        <div class="page-header">
          <h1>系統設定</h1>
        </div>
        <div id="settings-message" class="message hidden"></div>
        <form class="form-card" id="settings-form">
          <div class="form-group">
            <label for="settings-email-user">Gmail 帳號</label>
            <input type="email" id="settings-email-user" placeholder="your@gmail.com" />
          </div>
          <div class="form-group">
            <label for="settings-email-pass">Gmail App 密碼</label>
            <input type="password" id="settings-email-pass" placeholder="留空表示不修改" />
          </div>
          <div class="form-group">
            <label for="settings-email-to">通知收件人</label>
            <input type="email" id="settings-email-to" placeholder="alert@example.com" />
          </div>
          <div class="form-group">
            <label for="settings-smtp-port">SMTP Port</label>
            <input type="number" id="settings-smtp-port" value="587" />
          </div>
          <div class="form-group">
            <label for="settings-port">HTTP Port（變更後需重啟）</label>
            <input type="number" id="settings-port" value="8080" />
          </div>
          <div class="form-group form-group-inline">
            <input type="checkbox" id="settings-email-enabled" />
            <label for="settings-email-enabled">啟用 Email 通知</label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">儲存設定</button>
            <button type="button" class="btn btn-secondary" id="btn-test-email">寄送測試信</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <!-- Low-stock alert modal -->
  <div id="low-stock-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="low-stock-modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="low-stock-modal-title">⚠ 庫存警示</h2>
        <button class="modal-close" id="btn-close-low-stock-modal" aria-label="關閉">✕</button>
      </div>
      <p class="modal-desc">以下零件庫存已達再訂購水位，請注意補貨：</p>
      <ul id="low-stock-modal-list" class="low-stock-list"></ul>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btn-confirm-low-stock-modal">確認</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
